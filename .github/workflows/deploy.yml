name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/wizardly-keller-yg0bj7
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode deploy key
        # DEPLOY_SSH_KEY_B64 is the private key run through `base64 -w0` on
        # the server before being pasted into this secret — a multi-line
        # OpenSSH key pasted directly into a GitHub secret has repeatedly
        # come out corrupted here (confirmed: "error in libcrypto" from a
        # freshly generated key that `ssh -i` verified works fine read
        # straight off disk, so the key itself was never the problem — only
        # the copy into the secret was). A single base64 line has no
        # special characters, line breaks, or BEGIN/END markers to drop
        # mid-paste, so there's nothing left for a paste to corrupt.
        id: deploy_key
        env:
          KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          DELIM="SSHKEY_${{ github.run_id }}_${{ github.run_attempt }}"
          echo "key<<$DELIM" >> "$GITHUB_OUTPUT"
          echo "$KEY_B64" | base64 -d >> "$GITHUB_OUTPUT"
          echo "$DELIM" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy dist/ over SSH
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ steps.deploy_key.outputs.key }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SOURCE: dist/
          ARGS: '-rltzv --delete'

      - name: Fix permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ steps.deploy_key.outputs.key }}
          script: |
            find ${{ secrets.DEPLOY_PATH }} -type d -exec chmod 755 {} \;
            find ${{ secrets.DEPLOY_PATH }} -type f -exec chmod 644 {} \;

      - name: Notify search engines via IndexNow
        # IndexNow (api.indexnow.org) is a real, free, no-credential protocol
        # that Bing, Yandex, Seznam and Naver all consume to recrawl changed
        # URLs within minutes instead of waiting for their next scheduled
        # crawl. Google does not consume IndexNow — there is no equivalent
        # unauthenticated "crawl this now" mechanism for Google; fast
        # reindexing there requires Search Console access (URL Inspection /
        # Request Indexing), which only the account owner can grant.
        # Best-effort only (continue-on-error): a transient failure here
        # must never fail an otherwise-successful deploy.
        continue-on-error: true
        run: |
          KEY="a9cbe1680f2a3614f2977eb5ecc12df8"
          URLS=$(grep -ohE '<loc>[^<]+</loc>' dist/sitemap-*.xml dist/sitemap.xml 2>/dev/null | sed -E 's#</?loc>##g' | sort -u | head -10000)
          if [ -z "$URLS" ]; then
            echo "No sitemap URLs found — skipping IndexNow submission."
            exit 0
          fi
          URL_LIST=$(printf '%s\n' "$URLS" | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -sS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"shahidiqbal.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://shahidiqbal.com/$KEY.txt\",\"urlList\":$URL_LIST}" \
            -o /dev/null -w "IndexNow response: %{http_code}\n"
