name: Deploy Shahid Security Admin

# apps/admin is deployed by Hostinger's own native Git-connected build
# pipeline (hPanel → the admin app → Deployments), not by this workflow —
# confirmed for its sibling apps/learn app, same account, same pattern.
# This workflow's only remaining job is running database migrations and
# grants afterward, which that native pipeline has no way to know about:
# it runs `pnpm install && pnpm build`, nothing else, and the database is
# only reachable from the already-deployed server process, never from
# GitHub's runners (confirmed: a prior version of this workflow that ran
# `pnpm db:migrate` directly here would have gotten ECONNREFUSED, same as
# apps/learn's identical setup did).
#
# A previous version of this workflow also did its own build + SSH/rsync
# deploy — removed because it was redundant with (and raced) Hostinger's
# native pipeline, deploying to a target the live site wasn't even served
# from.
#
# IMPORTANT, confirmed against a real deploy: hPanel's own "Redeploy"
# button for the admin app is NOT reliable after a repo change — it can
# say "Source: previous deployment source" / "Restoring previous source
# files from the last successful deployment" instead of re-cloning, which
# reused a stale pnpm-workspace.yaml and reintroduced an
# ERR_PNPM_IGNORED_BUILDS failure that a fresh clone of the exact same
# commit (triggered by this workflow's own push, moments earlier) did not
# have. Always force a fresh clone by pushing a real commit (this workflow
# re-running from a `push` event is enough) rather than clicking Redeploy
# after a config/dependency change.
on:
  push:
    branches:
      - claude/wizardly-keller-yg0bj7
    paths:
      - 'apps/admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Required secrets:
    #   ADMIN_APP_URL        — https://admin.shahidiqbal.com (its own
    #                          subdomain — see next.config.mjs's comment;
    #                          an earlier version of this file incorrectly
    #                          documented this as a /admin path on the
    #                          main domain)
    #   ADMIN_MIGRATE_SECRET — sent as the x-migrate-secret header to
    #                          /api/internal/migrate and
    #                          /api/internal/apply-grants. Must match
    #                          MIGRATE_SECRET set in Hostinger's own
    #                          Environment variables panel for this app
    #                          (hPanel → the admin app → Environment
    #                          variables) — a GitHub Actions secret never
    #                          reaches the deployed process on its own.
    #                          Every other runtime var this app needs
    #                          (DATABASE_URL, DATABASE_ADMIN_URL,
    #                          LEARN_DATABASE_URL, SESSION_SECRET,
    #                          TOKEN_ENCRYPTION_KEY, SMTP_*, etc. — see
    #                          apps/admin/.env.example) goes in that same
    #                          panel, not here.
    steps:
      - name: Wait for this commit's build to actually be live
        # Same race, same fix as deploy-lms.yml's identical step — see
        # its comment for the confirmed real-deploy evidence
        # (commit 995a028, run 40789899956) that motivated this.
        # scripts/write-build-info.mjs stamps public/build-info.json
        # with the exact git SHA being built, on every build, so this
        # step can poll for that SHA actually being served before
        # migrate is ever called, instead of hoping the first request
        # happens to land after Hostinger's async build/swap finishes.
        run: |
          echo "Waiting for ${{ secrets.ADMIN_APP_URL }}/build-info.json to report sha=${{ github.sha }} ..."
          for i in $(seq 1 60); do
            live_sha=$(curl --silent --show-error --max-time 10 "${{ secrets.ADMIN_APP_URL }}/build-info.json" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')
            if [ "$live_sha" = "${{ github.sha }}" ]; then
              echo "Live build matches this commit (sha=$live_sha) after $i attempt(s)."
              exit 0
            fi
            echo "Attempt $i/60: live sha is '$live_sha', not yet ${{ github.sha }} — waiting 10s."
            sleep 10
          done
          echo "Gave up waiting after 10 minutes — live build never matched this commit. Proceeding with migrate anyway (same behavior as before this check existed), but this needs a look." >&2

      - name: Run database migrations
        # The retry window (up to ~10 minutes) is deliberately generous:
        # this job fires on the same push that triggers Hostinger's native
        # build, with no way to know when that finishes, so it has to wait
        # it out. --retry-all-errors (not just --retry-connrefused) is
        # required here because the old code (or a 404 while nothing has
        # deployed yet) still returns a real HTTP response, which plain
        # --retry does not retry on by default.
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 30 --retry-delay 20 --retry-all-errors \
            -X POST "${{ secrets.ADMIN_APP_URL }}/api/internal/migrate" \
            -H "x-migrate-secret: ${{ secrets.ADMIN_MIGRATE_SECRET }}"
          echo

      - name: Apply database grants (idempotent)
        # Same reasoning as the migrations step above — see
        # apps/admin/src/app/api/internal/apply-grants/route.ts.
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 30 --retry-delay 20 --retry-all-errors \
            -X POST "${{ secrets.ADMIN_APP_URL }}/api/internal/apply-grants" \
            -H "x-migrate-secret: ${{ secrets.ADMIN_MIGRATE_SECRET }}"
          echo
