name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/wizardly-keller-yg0bj7
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Debug secret shape (no values printed)
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          P: ${{ secrets.DEPLOY_PORT }}
        run: |
          echo "DEPLOY_HOST length: ${#H}"
          echo "DEPLOY_USER length: ${#U}"
          echo "DEPLOY_PORT length: ${#P}"
          [[ "$H" =~ ^[A-Za-z0-9.-]+$ ]] && echo "DEPLOY_HOST format: OK" || echo "DEPLOY_HOST format: INVALID (has unexpected chars)"
          [[ "$U" =~ ^[A-Za-z0-9_-]+$ ]] && echo "DEPLOY_USER format: OK" || echo "DEPLOY_USER format: INVALID (has unexpected chars)"
          [[ "$P" =~ ^[0-9]+$ ]] && echo "DEPLOY_PORT format: OK" || echo "DEPLOY_PORT format: INVALID (has unexpected chars)"

      - name: Deploy dist/ over SSH
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SOURCE: dist/
          ARGS: '-rltzv --delete'

      - name: Fix permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            find ${{ secrets.DEPLOY_PATH }} -type d -exec chmod 755 {} \;
            find ${{ secrets.DEPLOY_PATH }} -type f -exec chmod 644 {} \;
