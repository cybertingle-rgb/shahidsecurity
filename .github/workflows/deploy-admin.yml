name: Deploy Shahid Security Admin

# Separate workflow, separate trigger path, separate deploy target from
# deploy.yml (the marketing site) and deploy-lms.yml (the LMS) — three
# independent Node.js apps on the same Hostinger account, same pattern
# as deploy-lms.yml. Only runs when apps/admin/** actually changes.
on:
  push:
    branches:
      - claude/wizardly-keller-yg0bj7
    paths:
      - 'apps/admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Required secrets (see docs/DATABASE.md and docs/DEPLOYMENT.md):
    #   ADMIN_DATABASE_ADMIN_URL — full-privilege MySQL user (Hostinger
    #                              hPanel-issued) — runs migrations and
    #                              apply-grants; needs GRANT OPTION.
    #   ADMIN_DATABASE_URL       — the narrower runtime user's connection
    #                              string — apply-grants.ts creates the
    #                              MySQL user and its grants automatically.
    #   ADMIN_SESSION_SECRET     — random, 32+ chars, distinct from any
    #                              other app's session secret.
    #   ADMIN_TOKEN_ENCRYPTION_KEY — 32 bytes hex (64 chars) — encrypts
    #                              Google OAuth tokens at rest. Generate
    #                              with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
    #   ADMIN_APP_URL            — https://shahidiqbal.com/admin (a path
    #                              on the main domain — see
    #                              next.config.mjs's basePath — not a
    #                              subdomain).
    #   ADMIN_MIGRATE_SECRET, ADMIN_PUBLISH_SCHEDULED_SECRET,
    #   ADMIN_LEADS_INTAKE_SECRET, ADMIN_AI_QUESTIONS_INTAKE_SECRET,
    #   ADMIN_SEED_SECRET, ADMIN_SMTP_HOST, ADMIN_SMTP_PORT,
    #   ADMIN_SMTP_USER, ADMIN_SMTP_PASSWORD —
    #                              each a distinct random value (the
    #                              SMTP ones are the real mailbox
    #                              credentials); see the matching env
    #                              vars' comments in
    #                              apps/admin/.env.example and
    #                              docs/ADMIN_AUTH.md. These are runtime
    #                              env vars, not read at build time by
    #                              this workflow's "Build" step — they
    #                              must also be set directly on the
    #                              Hostinger Node.js App itself
    #                              (hPanel → that app → Environment
    #                              variables), since GitHub Actions'
    #                              build-time secrets don't carry into
    #                              the deployed running process.
    #   ADMIN_GOOGLE_CLIENT_ID, ADMIN_GOOGLE_CLIENT_SECRET — optional,
    #                              only once Google Cloud Console
    #                              credentials exist (see
    #                              docs/GOOGLE_INTEGRATION_SETUP.md).
    #   DEPLOY_ADMIN_PATH        — e.g.
    #                              /home/<your-hostinger-user-id>/domains/shahidiqbal.com/public_html/admin
    #                              — required, no fallback (a wrong
    #                              guessed path previously hardcoded
    #                              here pointed at a different
    #                              Hostinger account entirely).
    # Reused from the existing marketing-site workflow (same Hostinger
    # account, different target path):
    #   DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER
    #
    # IMPORTANT — this workflow is UNTESTED against the real Hostinger
    # account: every run to date has failed at the Build step because
    # none of the secrets above exist yet (see docs/DEPLOYMENT.md). Once
    # they're set, this should work, but treat the first real run as a
    # first real run, not a known-good path.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/admin
        env:
          DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.ADMIN_TOKEN_ENCRYPTION_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.ADMIN_APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.ADMIN_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.ADMIN_APP_URL }}/api/google/callback
        run: pnpm build
        # pnpm build (package.json) already runs
        # scripts/flatten-standalone.mjs after next build — it collapses
        # the monorepo nesting out of .next/standalone (outputFileTracingRoot
        # points at the workspace root so Turbopack can resolve this app's
        # symlinked node_modules, which nests the output under apps/admin/
        # as a side effect), copies in .next/static and public/, and
        # rewrites the one absolute-path symlink Next's bundler emits for
        # node_modules/next into a relative one. All confirmed against a
        # real build moved to a different absolute path — see that
        # script's comments for why each step exists. No separate
        # assembly step needed here anymore.

      - name: Run pending database migrations
        working-directory: apps/admin
        env:
          DATABASE_ADMIN_URL: ${{ secrets.ADMIN_DATABASE_ADMIN_URL }}
        run: pnpm db:migrate

      - name: Provision the narrow runtime user and its grants (idempotent)
        working-directory: apps/admin
        env:
          DATABASE_ADMIN_URL: ${{ secrets.ADMIN_DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: pnpm db:apply-grants

      - name: Deploy standalone bundle over SSH
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          # Served at shahidiqbal.com/admin (see next.config.mjs's
          # basePath) — a subdirectory of the SAME domain's public_html,
          # not a separate subdomain. No hardcoded fallback here on
          # purpose (unlike this workflow's earlier version): a wrong
          # guessed path fails loudly by requiring this secret, rather
          # than silently deploying to a path on a different Hostinger
          # account. Real example shape: /home/<your-hostinger-user-id>/domains/shahidiqbal.com/public_html/admin
          TARGET: ${{ secrets.DEPLOY_ADMIN_PATH }}
          SOURCE: apps/admin/.next/standalone/
          # --exclude (not --delete-excluded) deliberately leaves the
          # remote `data/` directory alone — that's where the media
          # library's uploaded files actually live (see
          # src/lib/media.ts), created at runtime, never part of the
          # build output. A plain `--delete` without this exclusion
          # would erase every uploaded file on every deploy.
          ARGS: '-rltzv --delete --exclude=data'

      - name: Restart the app (Passenger convention — verify this actually works in hPanel)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            APP_DIR="${{ secrets.DEPLOY_ADMIN_PATH }}"
            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"
