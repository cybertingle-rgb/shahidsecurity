name: Deploy Learn with Shahid (LMS)

# apps/learn is deployed by Hostinger's own native Git-connected build
# pipeline (hPanel → learn.shahidiqbal.com → Deployments), not by this
# workflow — confirmed it auto-builds and serves this repo's commits
# directly. This workflow's only remaining job is running database
# migrations and grants afterward, which that native pipeline has no way
# to know about: it runs `pnpm install && pnpm build`, nothing else, and
# the database is only reachable from the already-deployed server process,
# never from GitHub's runners (confirmed: a prior version of this workflow
# that ran `pnpm db:migrate` directly here got ECONNREFUSED every time).
#
# A previous version of this workflow also did its own build + SSH/rsync
# deploy — removed because it was redundant with (and raced) Hostinger's
# native pipeline, deploying to a target the live site wasn't even served
# from.
on:
  push:
    branches:
      - claude/wizardly-keller-yg0bj7
    paths:
      - 'apps/learn/**'
      - '.github/workflows/deploy-lms.yml'
  workflow_dispatch:

concurrency:
  group: deploy-lms
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Required secrets:
    #   LMS_APP_URL        — e.g. https://learn.shahidiqbal.com
    #   LMS_MIGRATE_SECRET — sent as the x-migrate-secret header to
    #                        /api/internal/migrate and
    #                        /api/internal/apply-grants. Must match
    #                        MIGRATE_SECRET set in Hostinger's own
    #                        Environment variables panel for this app
    #                        (hPanel → learn.shahidiqbal.com →
    #                        Environment variables) — a GitHub Actions
    #                        secret never reaches the deployed process on
    #                        its own.
    steps:
      - name: Run database migrations
        # The retry window (up to ~10 minutes) is deliberately generous:
        # this job fires on the same push that triggers Hostinger's native
        # build, with no way to know when that finishes, so it has to wait
        # it out. --retry-all-errors (not just --retry-connrefused) is
        # required here because the old code (or a 404 while nothing has
        # deployed yet) still returns a real HTTP response, which plain
        # --retry does not retry on by default.
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 30 --retry-delay 20 --retry-all-errors \
            -X POST "${{ secrets.LMS_APP_URL }}/api/internal/migrate" \
            -H "x-migrate-secret: ${{ secrets.LMS_MIGRATE_SECRET }}"
          echo

      - name: Apply database grants (idempotent)
        # Same reasoning as the migrations step above — see
        # apps/learn/src/app/api/internal/apply-grants/route.ts.
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 30 --retry-delay 20 --retry-all-errors \
            -X POST "${{ secrets.LMS_APP_URL }}/api/internal/apply-grants" \
            -H "x-migrate-secret: ${{ secrets.LMS_MIGRATE_SECRET }}"
          echo
